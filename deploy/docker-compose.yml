services:
  quran-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: quran-server:latest
    container_name: quran-server
    restart: unless-stopped
    env_file:
      - ../server/.env
    # proxy is for Traefik; jwla is where the shared postgres container lives.
    networks: [proxy, jwla]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.quran.rule=Host(`quran.alhasnalshrif.com`)
      - traefik.http.routers.quran.entrypoints=web
      - traefik.http.routers.quran-secure.rule=Host(`quran.alhasnalshrif.com`)
      - traefik.http.routers.quran-secure.entrypoints=websecure
      - traefik.http.routers.quran-secure.tls=true
      - traefik.http.services.quran.loadbalancer.server.port=8787
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Daily pg_dump into R2, keeping 30 days (02 §9).
  quran-backup:
    build:
      context: .
      dockerfile: backup.Dockerfile
    container_name: quran-backup
    restart: unless-stopped
    env_file:
      - ../server/.env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-admin}
      PGDATABASE: ${POSTGRES_DB:-quran}
    networks: [jwla]

networks:
  # Both already exist on the VPS; this project only joins them.
  proxy:
    external: true
  jwla:
    external: true
