services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: quran
      POSTGRES_PASSWORD: quran
      POSTGRES_DB: quran
    ports:
      - '5432:5432'
    volumes:
      - quran-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quran -d quran']
      interval: 5s
      timeout: 3s
      retries: 20

# Pack storage is Cloudflare R2 (D4), not a local service: point
# S3_ENDPOINT/S3_BUCKET at the dev bucket in server/.env.

volumes:
  quran-postgres-dev:
