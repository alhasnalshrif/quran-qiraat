services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: quran
      POSTGRES_PASSWORD: quran
      POSTGRES_DB: quran
    ports:
      - '5432:5432'
    volumes:
      - quran-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quran -d quran']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - quran-minio-dev:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/quran &&
      echo 'minio bucket ready'
      "

volumes:
  quran-postgres-dev:
  quran-minio-dev:
